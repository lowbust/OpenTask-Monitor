[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opentask-monitor"
version = "0.2.2"
description = "Open-source Windows process, service and startup monitor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "OpenTask Monitor contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = ["psutil>=6.1,<8", "PySide6-Essentials>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
opentask-monitor = "opentask.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opentask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
